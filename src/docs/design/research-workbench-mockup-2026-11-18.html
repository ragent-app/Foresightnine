<style>
/* v4 · Ragent palette + Apple-style deference. Level 1: collapsible sidebar + content with large title that collapses into a

   (non-modal) and overlays as a sheet on narrow screens. Tokens: docs/design/research-workbench-ui-2026-11-18.md §2. */
:root {
  --primary: #000000; --on-primary: #ffffff;
  --surface: #ffffff; --s-low: #f5f6f8; --s-mid: #eef0f3;

  --group: rgba(255, 255, 255, 0.8);
  --blur: saturate(180%) blur(24px);
  --float: 0 12px 40px rgba(20, 24, 33, 0.08), 0 2px 6px rgba(20, 24, 33, 0.04);
  --float-sm: 0 6px 20px rgba(20, 24, 33, 0.06), 0 1px 2px rgba(20, 24, 33, 0.04);
  --success: #2f7a42; --counter: #2b5aa8; --warning: #9a6200; --warning-t: rgba(217, 119, 6, 0.09); --mark: rgba(255, 196, 0, 0.32);
  --error: #c0262d; --error-t: rgba(192, 38, 45, 0.09);
  --running: #2563eb; --done: #16a34a; --failed: #dc2626; --waiting: #d97706;
  --hover: rgba(0, 0, 0, 0.04); --scrim: rgba(15, 18, 25, 0.10);
  --font: Inter, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
  --ease: cubic-bezier(0.2, 0, 0, 1); --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --side-w: 264px; --panel-w: 420px;
}

  --primary: #ffffff; --on-primary: #000000; --surface: #000000; --s-low: #0c0c0d; --s-mid: #151517;

  --fill: rgba(120, 120, 128, 0.30); --fill-2: rgba(120, 120, 128, 0.22); --fill-3: rgba(120, 120, 128, 0.14);
  --separator: rgba(255, 255, 255, 0.11); --hairline: rgba(255, 255, 255, 0.10);
  --glass: rgba(28, 28, 30, 0.66); --glass-strong: rgba(30, 30, 32, 0.82); --glass-edge: rgba(255, 255, 255, 0.07); --group: rgba(255, 255, 255, 0.06);
  --float: 0 12px 40px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4); --float-sm: 0 6px 20px rgba(0, 0, 0, 0.45);
  --success: #8fd19a; --counter: #9dbdf5; --warning: #f5bd4f; --warning-t: rgba(245, 189, 79, 0.12); --mark: rgba(245, 189, 79, 0.30);
  --error: #ffb4ab; --error-t: rgba(255, 180, 171, 0.13);
  --running: #60a5fa; --done: #34d399; --failed: #f87171; --waiting: #fbbf24; --hover: rgba(255, 255, 255, 0.06); --scrim: rgba(0, 0, 0, 0.35);

:root[data-theme="dark"] {
  --primary: #ffffff; --on-primary: #000000; --surface: #000000; --s-low: #0c0c0d; --s-mid: #151517;
  --on-surface: #f5f5f7; --on-variant: #b3b5bb; --on-tertiary: #8a8c92;
  --fill: rgba(120, 120, 128, 0.30); --fill-2: rgba(120, 120, 128, 0.22); --fill-3: rgba(120, 120, 128, 0.14);
  --separator: rgba(255, 255, 255, 0.11); --hairline: rgba(255, 255, 255, 0.10);
  --glass: rgba(28, 28, 30, 0.66); --glass-strong: rgba(30, 30, 32, 0.82); --glass-edge: rgba(255, 255, 255, 0.07); --group: rgba(255, 255, 255, 0.06);
  --float: 0 12px 40px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4); --float-sm: 0 6px 20px rgba(0, 0, 0, 0.45);
  --success: #8fd19a; --counter: #9dbdf5; --warning: #f5bd4f; --warning-t: rgba(245, 189, 79, 0.12); --mark: rgba(245, 189, 79, 0.30);
  --error: #ffb4ab; --error-t: rgba(255, 180, 171, 0.13);
  --running: #60a5fa; --done: #34d399; --failed: #f87171; --waiting: #fbbf24; --hover: rgba(255, 255, 255, 0.06); --scrim: rgba(0, 0, 0, 0.35);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.meta { font-size: 12px; color: var(--on-tertiary); line-height: 1.5; }
.mono { font-family: var(--mono); font-size: 12px; }

.glass { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 0 0 1px var(--glass-edge), 0 0 0 0.5px var(--hairline), var(--float-sm); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass, .panel, .pop, .menu, .toolbar.scrolled { background: var(--surface) !important; } }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 16px; border-radius: 17px; border: 0; cursor: pointer;
  font-size: 14px; font-weight: 500; background: var(--fill-2); color: var(--on-surface); white-space: nowrap; text-decoration: none; transition: background 120ms var(--ease), transform 120ms var(--ease), opacity 120ms; }
.btn:hover { background: var(--fill); } .btn:active { transform: scale(0.98); }

.btn.plain { background: transparent; color: var(--on-variant); padding: 0 10px; } .btn.plain:hover { background: var(--hover); color: var(--on-surface); }
.btn.lg { min-height: 40px; border-radius: 20px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--on-variant); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; transition: background 120ms var(--ease), color 120ms; }
.icon-btn:hover { background: var(--hover); color: var(--on-surface); }

.icon-btn.send.ready { background: var(--primary); color: var(--on-primary); }
.icon-btn.close { width: 28px; height: 28px; background: var(--fill-2); }
.link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--on-variant); font-size: 13px; text-decoration: none; }
.link:hover { color: var(--on-surface); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.dot.running { background: var(--running); animation: pulse 1.6s var(--ease) infinite; }
.dot.done { background: var(--done); } .dot.partial { background: var(--waiting); } .dot.failed { background: var(--failed); }
@keyframes pulse { 50% { opacity: .35; } }
.role { font-size: 12px; font-weight: 600; white-space: nowrap; letter-spacing: 0.01em; }
.role.support { color: var(--success); } .role.counter { color: var(--counter); } .role.review { color: var(--warning); } .role.error { color: var(--error); } .role.neutral { color: var(--on-tertiary); }

/* scaffold */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100%; transition: grid-template-columns 320ms var(--spring); }
.app.side-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
.side { background: var(--s-low); display: flex; flex-direction: column; gap: 2px; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px calc(12px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); overflow: hidden auto; min-width: 0; }
.app.side-collapsed .side { visibility: hidden; }
.side-head { display: flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 2px 6px; }
.side-head .grow { flex: 1; }
.brand-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-left: 6px; }
.search { display: flex; align-items: center; gap: 8px; min-height: 32px; margin: 0 2px 10px; padding: 0 10px; border-radius: 10px; background: var(--fill-2); color: var(--on-tertiary); font-size: 13px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 13px; color: var(--on-surface); }
.side .group { font-size: 11.5px; font-weight: 600; color: var(--on-tertiary); padding: 12px 12px 4px; }
.row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; text-decoration: none; color: var(--on-surface); min-height: 36px; font-size: 13.5px; line-height: 1.4; transition: background 120ms var(--ease); }
.row:hover { background: var(--hover); }
.row[aria-current="page"] { background: var(--fill-2); font-weight: 500; }
.row .q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 1px; padding-top: 10px; }
.side .foot a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--on-variant); text-decoration: none; font-size: 13.5px; }
.side .foot a:hover { background: var(--hover); color: var(--on-surface); }
.main { min-width: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; transition: padding-right 320ms var(--spring); }
.app.with-panel .main { padding-right: calc(var(--panel-w) + 12px); }
.toolbar { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 2px; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; min-height: calc(52px + env(safe-area-inset-top, 0px));
  transition: background 180ms var(--ease), box-shadow 180ms var(--ease); }
.app.with-panel .toolbar, .app.with-panel .dock { right: calc(var(--panel-w) + 12px); }
.toolbar.scrolled { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 0.5px 0 var(--hairline); }
.toolbar .tb-title { flex: 1; min-width: 0; text-align: center; font-size: 13.5px; font-weight: 600; opacity: 0; transform: translateY(4px); transition: opacity 180ms var(--ease), transform 180ms var(--ease);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
.toolbar.scrolled .tb-title { opacity: 1; transform: none; }
.toolbar .when-collapsed { display: none; }
.app.side-collapsed .toolbar .when-collapsed { display: inline-flex; }
.scroll { flex: 1; overflow: auto; }
.col { max-width: 720px; margin: 0 auto; padding: calc(64px + env(safe-area-inset-top, 0px)) 28px 200px; }

/* large title */
.large-title h1 { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.3; letter-spacing: -0.02em; text-wrap: pretty; max-width: 30em; }
.large-title .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 13px; }

/* conversation */
.turn { display: flex; flex-direction: column; gap: 14px; padding-top: 36px; }
.stamp { align-self: center; font-size: 11.5px; color: var(--on-tertiary); }
.ask { align-self: flex-end; max-width: 80%; background: var(--fill-3); border-radius: 20px; padding: 9px 16px; font-size: 16px; line-height: 1.55; }
.answer { display: flex; flex-direction: column; gap: 14px; }
.status { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.answer p { margin: 0; }
.cite-n { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; margin: 0 1px; border-radius: 8px; border: 0;
  background: var(--fill-2); color: var(--on-variant); font-size: 10px; font-weight: 600; vertical-align: 2px; cursor: pointer; line-height: 1; transition: background 120ms var(--ease); }
.cite-n:hover, .cite-n[aria-expanded="true"] { background: var(--primary); color: var(--on-primary); }
.claims { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.claims li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 15px; line-height: 1.6; border-radius: 8px; transition: background 240ms var(--ease); }
.claims li.flash { background: var(--fill-3); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 32px; }
.stat { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; color: inherit; }
.stat b { font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--on-tertiary); }
.stat:hover b { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 13px; color: var(--on-tertiary); }
.summary .link { font-size: 13px; color: var(--on-variant); }
.summary .sep { opacity: .5; }
.note { font-size: 12px; color: var(--on-tertiary); margin: 0; }
.callout { background: var(--warning-t); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.callout .h { font-weight: 600; color: var(--warning); }
.callout ul { margin: 0; padding-left: 18px; line-height: 1.6; }
.callout .why { font-size: 12.5px; color: var(--on-variant); }
.callout .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

/* composer */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 56px 24px calc(16px + env(safe-area-inset-bottom, 0px)); pointer-events: none; transition: right 320ms var(--spring);
  background: linear-gradient(to bottom, transparent, var(--surface) 32px); }
.dock-inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.suggest { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 14px; min-height: 22px; }
.suggest .link { font-size: 12.5px; }
.livebar { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 3px 4px 3px 14px; border-radius: 18px; border: 0; cursor: pointer; text-align: left; font-size: 13px; color: var(--on-surface); }
.livebar .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer { border-radius: 22px; padding: 5px; display: flex; align-items: flex-end; gap: 2px; }
.composer textarea { flex: 1; border: 0; background: transparent; resize: none; outline: none; min-height: 34px; max-height: 200px; padding: 6px 6px; font-size: 15.5px; line-height: 1.45; }
.composer textarea::placeholder { color: var(--on-tertiary); }
.token { display: inline-flex; align-items: center; gap: 2px; min-height: 24px; padding: 0 2px 0 9px; border-radius: 12px; background: var(--fill-2); color: var(--on-variant); font-size: 12px; max-width: 100%; }
.token span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.token button { width: 20px; height: 20px; border-radius: 50%; border: 0; background: none; cursor: pointer; color: var(--on-tertiary); }
.tokens { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 4px; }

/* popover, menu */
.pop, .menu { position: fixed; z-index: 40; background: var(--glass-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: inset 0 0 0 1px var(--glass-edge), 0 0 0 0.5px var(--hairline), var(--float); animation: pop-in 180ms var(--spring); }
@keyframes pop-in { from { opacity: 0; transform: scale(0.97); } }
.pop { width: min(330px, calc(100vw - 32px)); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.pop q { quotes: "“" "”"; line-height: 1.6; }
.pop .actions { display: flex; gap: 6px; margin-top: 4px; }
.menu { min-width: 210px; border-radius: 12px; padding: 5px; display: flex; flex-direction: column; }
.menu button { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 10px; border-radius: 7px; border: 0; background: none; cursor: pointer; text-align: left; font-size: 13.5px; color: var(--on-surface); }
.menu button svg { color: var(--on-variant); width: 16px; height: 16px; }
.menu button:hover { background: var(--fill-2); }
.menu hr { border: 0; height: 0.5px; background: var(--separator); margin: 4px 10px; }

/* level-2 panel (inspector on wide screens, sheet on narrow) */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
.panel { position: fixed; z-index: 31; top: 12px; right: 12px; bottom: 12px; width: var(--panel-w); border-radius: 22px; display: flex; flex-direction: column; overflow: hidden;
  background: var(--glass-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: inset 0 0 0 1px var(--glass-edge), 0 0 0 0.5px var(--hairline), var(--float); animation: panel-in 320ms var(--spring); }
@keyframes panel-in { from { transform: translateX(24px); opacity: 0; } }
.panel header { display: flex; align-items: center; gap: 8px; padding: 14px 12px 6px 18px; }
.panel header h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.panel .body { flex: 1; overflow: auto; padding: 6px 14px 28px; display: flex; flex-direction: column; gap: 18px; }
.panel .foot { padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; justify-content: flex-end; box-shadow: 0 -0.5px 0 var(--separator); }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill-2); }
.panel > .seg { margin: 0 14px 6px; }
.seg button { flex: 1; min-height: 28px; padding: 0 12px; border-radius: 7px; border: 0; background: transparent; cursor: pointer; font-size: 13px; white-space: nowrap; color: var(--on-surface); transition: background 180ms var(--ease); }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.10), 0 0 0 0.5px var(--hairline); }
.seg.inline { display: inline-flex; } .seg.inline button { flex: none; }
.gtitle { font-size: 12px; font-weight: 500; color: var(--on-tertiary); margin: 0 6px 6px; display: flex; gap: 6px; align-items: baseline; }
.list { display: flex; flex-direction: column; background: var(--group); border-radius: 12px; overflow: hidden; }
.item { background: var(--group); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--on-surface); }
.list > .item { background: transparent; border-radius: 0; position: relative; }
.list > .item + .item::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 0.5px; background: var(--separator); }
button.item { border: 0; text-align: left; cursor: pointer; width: 100%; font: inherit; transition: background 120ms var(--ease); }
button.item:hover { background: var(--hover); }
.line { display: flex; align-items: baseline; gap: 10px; } .line .grow { flex: 1; min-width: 0; }
.value { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.01em; }
.flag { font-size: 12px; color: var(--warning); }
.chips { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--on-tertiary); }
.fact-ref { border: 0; background: var(--fill-2); border-radius: 6px; padding: 0 6px; min-height: 20px; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--on-variant); }
.leads { background: transparent; box-shadow: inset 0 0 0 1px var(--separator); }
.lead { padding: 9px 14px; font-size: 13px; color: var(--on-variant); display: flex; flex-direction: column; gap: 1px; position: relative; }
.lead + .lead::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 0.5px dashed var(--separator); }
.cov { height: 3px; background: var(--fill); border-radius: 2px; position: relative; overflow: hidden; margin-top: 4px; }
.cov i { position: absolute; top: 0; bottom: 0; background: var(--primary); border-radius: 2px; }
.perms { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--on-variant); }
.perms .no { text-decoration: line-through; color: var(--on-tertiary); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--group); border-radius: 12px; overflow: hidden; }
.step { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 1px 10px; padding: 9px 14px; font-size: 13.5px; align-items: start; position: relative; }
.step + .step::before { content: ""; position: absolute; top: 0; left: 44px; right: 0; height: 0.5px; background: var(--separator); }
.step .ic { color: var(--on-tertiary); padding-top: 2px; } .step .ic svg { width: 16px; height: 16px; }
.step .why { grid-column: 2 / 3; font-size: 12px; color: var(--on-variant); }

  const layer = document.getElementById("layer");
  const detent = !wide() && (kind === "record" || kind === "reader" || kind === "cite") ? (kind === "cite" ? "" : "medium") : "";
  layer.innerHTML = `${wide() && matchMedia("(min-width: 1280px)").matches ? "" : '<div class="scrim" data-close></div>'}<section class="panel ${detent}" role="${wide() && matchMedia("(min-width: 1280px)").matches ? "complementary" : "dialog"}" aria-label="${kind}">${PANELS[kind](S.panelArg)}</section>`;
}
function closeAll() { const had = S.panel; S.panel = null; document.getElementById("layer").innerHTML = ""; if (had) render(true); }
function closeFloating() { document.querySelectorAll(".pop, .menu, .menu-sheet, .floating-scrim").forEach((e) => e.remove()); document.querySelectorAll('[aria-expanded="true"]').forEach((e) => e.setAttribute("aria-expanded", "false")); }
function floating(html, anchor, alignRight) {
  closeFloating(); const wrap = document.createElement("div"); wrap.innerHTML = `<div class="floating-scrim" style="position:fixed;inset:0;z-index:39"></div>${html}`;
  document.body.append(...wrap.children); const el = document.querySelector(".pop, .menu"); const r = anchor.getBoundingClientRect();
  let left = alignRight ? r.right - el.offsetWidth : r.left - 8; left = Math.max(16, Math.min(left, innerWidth - el.offsetWidth - 16));
  let top = r.bottom + 6; if (top + el.offsetHeight > innerHeight - 16) top = Math.max(16, r.top - el.offsetHeight - 6);
  el.style.left = left + "px"; el.style.top = top + "px";
}
function openCite(btn) {
  const n = +btn.dataset.cite, q = CITES[n - 1], [a, b] = span(q);
  if (!matchMedia("(min-width: 600px)").matches) return openPanel("cite", n);
  btn.setAttribute("aria-expanded", "true");
  floating(`<div class="pop" role="dialog" aria-label="引用 ${n}"><span class="meta">引用 ${n} · ${SOURCE.title}</span><q>${esc(q)}</q><span class="meta">字符 ${a}–${b} · 位置与数字已核对，语义未核验</span>
    <div class="actions"><button class="btn primary" data-open="${esc(q)}">查看原文</button><button class="btn" data-focus="${n}">深挖这条引用</button></div></div>`, btn, false);
}
function openMenu(btn, which) {
  const items = which === "partial" ? [["review", "交付已有成果"], ["chev", "补充缺口", 'data-prefill="gap"'], ["plus", "添加资料"]]
    : [["review", "复核与版本", 'data-panel="review"'], ["tune", "研究设置", 'data-panel="settings"'], null, ["download", "导出完整记录（JSON）"], ["download", "仅导出元数据"]];
  if (!matchMedia("(min-width: 600px)").matches) {
    closeFloating(); const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="floating-scrim" style="position:fixed;inset:0;z-index:39;background:var(--scrim)"></div><div class="action-sheet menu-sheet" role="menu"><div class="group">${items.filter(Boolean).map((it) => `<button role="menuitem" ${it[2] || ""}>${it[1]}</button>`).join("")}</div><div class="group"><button class="cancel" data-dismiss>取消</button></div></div>`;
    document.body.append(...wrap.children); return;
  }
  floating(`<div class="menu" role="menu">${items.map((it) => it === null ? "<hr>" : `<button role="menuitem" ${it[2] || ""}>${ic(it[0])}${it[1]}</button>`).join("")}</div>`, btn, true);
}

const VIEWS = { topic: () => topicView(false), running: () => topicView(true), home: homeView, login: loginView, prefs: prefsView };
function render(keepScroll) {
  const prev = document.getElementById("scroll")?.scrollTop || 0;
  const h = location.hash.slice(1); S.view = VIEWS[h] ? h : "topic";
  document.getElementById("root").innerHTML = VIEWS[S.view]();
  const sc = document.getElementById("scroll"), tb = document.getElementById("toolbar");
  if (sc && keepScroll) sc.scrollTop = prev;
  if (sc && tb) { const upd = () => tb.classList.toggle("scrolled", sc.scrollTop > 56); sc.addEventListener("scroll", upd, { passive: true }); upd(); }
  const ask = document.getElementById("ask") || document.getElementById("home-q"), send = document.getElementById("send");
  if (ask && send) ask.addEventListener("input", () => send.classList.toggle("ready", ask.value.trim().length > 0));
}
document.addEventListener("click", (e) => {
  if (e.target.classList?.contains("floating-scrim")) return closeFloating();
  const t = e.target.closest("button, [data-close], [data-cancel], a"); if (!t) return;
  if (t.dataset.cancel !== undefined) { e.stopPropagation(); t.textContent = "正在取消…"; setTimeout(() => { location.hash = "topic"; }, 900); return; }
  if (t.hasAttribute("data-dismiss")) return closeFloating();
  if (t.hasAttribute("data-close-side")) { S.sideOpen = false; return render(true); }
  if (t.hasAttribute("data-detent")) { const pn = document.querySelector(".panel"); if (pn) { const big = pn.classList.toggle("large"); pn.classList.toggle("medium", !big); } return; }
  if (t.hasAttribute("data-start")) { location.hash = "running"; return; }
  if (t.dataset.cite) return openCite(t);
  if (t.dataset.open) { closeFloating(); return openPanel("reader", t.dataset.open); }
  if (t.closest(".menu-sheet")) closeFloating();
  if (t.hasAttribute("data-close")) return closeAll();
  if (t.dataset.menu !== undefined) return openMenu(t, t.dataset.menu);
  if (t.dataset.panel) { closeFloating(); if (t.dataset.tab) S.tab = t.dataset.tab; if (t.dataset.turn) S.stepTurn = +t.dataset.turn;
    if (S.panel === t.dataset.panel && t.closest(".toolbar")) return closeAll(); return openPanel(t.dataset.panel); }
  if (t.dataset.tab) { S.tab = t.dataset.tab; return openPanel("record"); }
  if (t.dataset.stepturn) { S.stepTurn = +t.dataset.stepturn; return openPanel("record"); }
  if (t.dataset.prefs) { S.prefsTab = t.dataset.prefs; return render(); }
  if (t.hasAttribute("data-toggle-side")) { if (wide()) { S.sideCollapsed = !S.sideCollapsed; try { localStorage.setItem("f9.side", S.sideCollapsed ? "collapsed" : "open"); } catch (er) {} } else S.sideOpen = !S.sideOpen; return render(true); }
  if (t.hasAttribute("data-new")) { location.hash = "home"; return; }
  if (t.dataset.focus) { S.focus = t.dataset.focus; closeFloating(); S.panel = null; document.getElementById("layer").innerHTML = ""; render(true); return document.getElementById("ask")?.focus(); }
  if (t.hasAttribute("data-unfocus")) { S.focus = null; return render(true); }
  if (t.dataset.prefill) { closeFloating(); const ask = document.getElementById("ask"); if (ask) { ask.value = t.dataset.prefill === "gap" ? "请继续补充上一轮的缺口：还没有引文位置已核实的结论。" : "请寻找与当前主要结论相反的证据，并说明它们的强度。"; ask.dispatchEvent(new Event("input")); ask.focus(); } return; }
  if (t.hasAttribute("data-example")) { const q = document.getElementById("home-q"); if (q) { q.value = t.textContent; q.dispatchEvent(new Event("input")); q.focus(); } return; }
  if (t.dataset.goto) { if (!matchMedia("(min-width: 1280px)").matches) closeAll(); const el = document.getElementById("claim-" + t.dataset.goto);
    if (el) { el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 900); } return; }
  if (t.matches(".seg button[aria-pressed]")) t.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === t)));
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (document.querySelector(".pop, .menu")) closeFloating(); else closeAll(); } });
window.addEventListener("hashchange", () => { closeFloating(); S.panel = null; document.getElementById("layer").innerHTML = ""; S.sideOpen = false; render(); });
window.addEventListener("resize", () => closeFloating());
render();
/* local review hook: ?panel=record&tab=numbers or ?cite=3 (query strings are ignored in the published viewer) */
try { const qp = new URLSearchParams(location.search); if (qp.get("collapsed")) { S.sideCollapsed = true; render(); }
  if (qp.get("panel")) { if (qp.get("tab")) S.tab = qp.get("tab"); openPanel(qp.get("panel"), qp.get("panel") === "cite" ? 3 : Q.rev26); }
  if (qp.get("cite")) openCite(document.querySelector(`[data-cite="${qp.get("cite")}"]`)); } catch (e) {}
</script>
